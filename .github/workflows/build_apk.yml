name: Flutter APK Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Initialize Flutter Android Scaffold & Fix Kotlin
        run: |
          flutter create . --platforms=android
          # Fix Kotlin version automatically in build.gradle
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = '\''1.9.24'\''/' android/build.gradle || true

      - name: Build APK
        run: flutter build apk --release
        env:
          ORG_GRADLE_PROJECT_jvmargs: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
